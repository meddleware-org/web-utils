# Node CI: lint the workflows, install, check the dependency tree, audit, type-check, lint, test, build the type declarations, and check what
# the npm tarball would contain; then run the tests again on the oldest supported Node. It runs on every push to main and every pull request,
# and the release workflow (npm-publish.yml) calls it on the tagged commit so a tag that fails these checks never publishes.
name: Node CI

on:
  push:
    branches: ["main"]
  pull_request:
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

# Read-only: CI needs nothing but the checkout.
permissions:
  contents: read

# No tool may phone home from CI (the fleet's privacy rule; npm, Node and other tools honour it).
env:
  DO_NOT_TRACK: "1"

jobs:
  check:
    name: Type-check & test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by full commit SHA with the version in a comment (D12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 26 is the fleet baseline (D56); the `node24-compat` job below keeps the declared floor honest.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # Workflow syntax and expression check, from a digest-pinned image so the linter itself cannot change underneath us.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

      # `npm ci` installs exactly the lockfile, so CI tests what was reviewed.
      - name: Install dependencies
        run: npm ci

      # Fails on a missing, extraneous or invalid package (a peer range nobody satisfies), which `npm ci` alone can let through.
      - name: Dependency tree is valid (peer ranges satisfied)
        run: npm ls --all >/dev/null

      # High and critical advisories fail unless .github/audit-allowlist.json accepts them with a reason and an expiry (an empty list today).
      - name: Audit dependencies
        run: node .github/audit-gate.mjs

      - name: Type-check
        run: npm run type-check

      - name: Lint JS (eslint)
        run: npm run lint

      # The tests: every export in both directions (CLAUDE.md, "Every export is proven by a test").
      - name: Test
        run: npm test

      # Emits dist/*.d.ts, the types consumers import.
      - name: Build declarations
        run: npm run build

      # The tarball must hold the source, the declarations and the manifest, and nothing else: a stray file would publish whatever it contains.
      - name: Package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const j = JSON.parse(require('fs').readFileSync('pack.json', 'utf8'))
            const p = Array.isArray(j) ? j[0] : Object.values(j)[0] // npm 12 keys the report by package name
            const files = p.files.map((f) => f.path)
            for (const f of ['src/index.ts', 'dist/index.d.ts', 'package.json']) if (!files.includes(f)) { console.error('missing from the tarball:', f); process.exit(1) }
            const stray = files.filter((f) => !/^(src\\/|dist\\/|package\\.json\$|LICENSE\$|README\\.md\$|CHANGELOG\\.md\$|SECURITY\\.md\$)/.test(f))
            if (stray.length) { console.error('unexpected files in the tarball:', stray); process.exit(1) }
          "

  # Node 24 stays supported as a library floor (D56) although the main job runs Node 26, so this job runs the tests on the floor.
  node24-compat:
    name: Node 24 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Test on the minimum supported Node
        run: npm test
